name: cpp-tests

on:
  push:
    branches: [master, main]
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-tests.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-tests.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build cpp/build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure -C ${{ matrix.build_type }}
