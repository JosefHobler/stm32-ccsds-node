name: cpp-tests

on:
  push:
    branches: [master, main]
    paths:
      - 'cpp/**'
      - 'ground/ccsds_codec.py'
      - 'ground/generate_fixtures.py'
      - '.github/workflows/cpp-tests.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'ground/ccsds_codec.py'
      - 'ground/generate_fixtures.py'
      - '.github/workflows/cpp-tests.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: core / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate differential fixtures
        run: python ground/generate_fixtures.py

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build cpp/build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure -C ${{ matrix.build_type }}

  nats-integration:
    name: nats-bridge / Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ curl tar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate differential fixtures
        run: python ground/generate_fixtures.py

      - name: Install nats-server
        run: |
          NATS_VERSION=v2.10.20
          curl -sL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/

      - name: Start nats-server (background)
        run: |
          nats-server -p 4222 > nats-server.log 2>&1 &
          # Give the server a moment to bind.
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 0.2
          done

      - name: Configure (with NATS)
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCCSDS_WITH_NATS=ON

      - name: Build
        run: cmake --build cpp/build

      - name: Test
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: ctest --test-dir cpp/build --output-on-failure

      - name: nats-server log on failure
        if: failure()
        run: cat nats-server.log || true

  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl tar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate differential fixtures
        run: python ground/generate_fixtures.py

      - name: Install nats-server
        run: |
          NATS_VERSION=v2.10.20
          curl -sL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/

      - name: Start nats-server (background)
        run: |
          nats-server -p 4222 > nats-server.log 2>&1 &
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 0.2
          done

      - name: Configure (sanitized + NATS)
        env:
          CC:  clang
          CXX: clang++
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCCSDS_SANITIZE=ON -DCCSDS_WITH_NATS=ON

      - name: Build
        run: cmake --build cpp/build

      - name: Test (with ASan/UBSan)
        env:
          NATS_URL: nats://127.0.0.1:4222
          # detect_leaks=0: cnats holds long-lived globals/threadlocals that
          # LSan flags as leaks at process exit. The bugs that actually
          # matter (use-after-free, heap-buffer-overflow, UB) are still
          # caught — these are the load-bearing checks for a packet parser.
          ASAN_OPTIONS:  detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir cpp/build --output-on-failure

      - name: nats-server log on failure
        if: failure()
        run: cat nats-server.log || true

  fuzz:
    name: fuzz (libFuzzer, 60s smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure (fuzz build)
        env:
          CC:  clang
          CXX: clang++
        run: cmake -S cpp -B cpp/build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCCSDS_BUILD_FUZZ=ON

      - name: Build fuzz_decode
        run: cmake --build cpp/build-fuzz --target fuzz_decode

      - name: Run libFuzzer for 60 seconds
        run: |
          ./cpp/build-fuzz/fuzz_decode \
            -max_total_time=60 \
            -print_final_stats=1 \
            -timeout=10
